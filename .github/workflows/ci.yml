name: ScaleOS Quality Gates

on:
  push:
    branches: ['master', 'v0.2-hardening', 'v0.3-computer-browser-use']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r computer_worker/requirements.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Browser Use E2E
        run: npm run test:e2e:browser

      - name: Computer Use E2E
        run: npm run test:e2e:computer

      - name: Production build
        run: npm run build
